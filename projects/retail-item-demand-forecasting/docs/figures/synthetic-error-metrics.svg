<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Synthetic forecast error comparisons</title><desc id="desc">Seasonal naive compared to gradient boosting on fictional item demand. Gradient boosting has lower MAE, RMSE and WAPE.</desc><rect width="1000" height="550" fill="#fff"/><text x="70" y="51" font-size="27" font-family="Arial,sans-serif" fill="#10233f" font-weight="700">Forecast error comparison</text><text x="70" y="81" font-size="16" font-family="Arial,sans-serif" fill="#64748b">Synthetic data only · lower is better</text><text x="70" y="160" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233f">MAE</text><text x="70" y="182" font-family="Arial,sans-serif" font-size="13" fill="#64748b">units / series-day</text><text x="279" y="162" text-anchor="end" font-family="Arial,sans-serif" fill="#475569" font-size="15">Seasonal naive</text><rect x="290" y="140" width="513.39" height="30" rx="5" fill="#e5a238"/><text x="813.3928571428571" y="162" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#18283e">4.886</text><text x="279" y="208" text-anchor="end" font-family="Arial,sans-serif" fill="#475569" font-size="15">Gradient boosting</text><rect x="290" y="186" width="410.95" height="30" rx="5" fill="#0f8a79"/><text x="710.945449096544" y="208" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#18283e">3.911</text><line x1="70" y1="261" x2="925" y2="261" stroke="#e2e8f0"/><text x="70" y="299" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233f">RMSE</text><text x="70" y="321" font-family="Arial,sans-serif" font-size="13" fill="#64748b">units / series-day</text><text x="279" y="301" text-anchor="end" font-family="Arial,sans-serif" fill="#475569" font-size="15">Seasonal naive</text><rect x="290" y="279" width="513.39" height="30" rx="5" fill="#e5a238"/><text x="813.3928571428571" y="301" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#18283e">6.306</text><text x="279" y="347" text-anchor="end" font-family="Arial,sans-serif" fill="#475569" font-size="15">Gradient boosting</text><rect x="290" y="325" width="421.72" height="30" rx="5" fill="#0f8a79"/><text x="721.721376466857" y="347" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#18283e">5.180</text><line x1="70" y1="400" x2="925" y2="400" stroke="#e2e8f0"/><text x="70" y="438" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233f">WAPE</text><text x="70" y="460" font-family="Arial,sans-serif" font-size="13" fill="#64748b">percent</text><text x="279" y="440" text-anchor="end" font-family="Arial,sans-serif" fill="#475569" font-size="15">Seasonal naive</text><rect x="290" y="418" width="513.39" height="30" rx="5" fill="#e5a238"/><text x="813.3928571428571" y="440" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#18283e">25.510%</text><text x="279" y="486" text-anchor="end" font-family="Arial,sans-serif" fill="#475569" font-size="15">Gradient boosting</text><rect x="290" y="464" width="411.00" height="30" rx="5" fill="#0f8a79"/><text x="710.9960379683037" y="486" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#18283e">20.422%</text><text x="70" y="535" font-size="14" font-family="Arial,sans-serif" fill="#64748b">These values were calculated by running the reproducible synthetic demonstration.</text></svg>