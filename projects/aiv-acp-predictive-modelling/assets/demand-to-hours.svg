<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="t d"><title id="t">Retail demand-to-hours calculation</title><desc id="d">Forecast divisional sales are allocated by sector mix. One route divides by AIV to calculate items, then by IPC to estimate cases. An alternative route divides by ACP to estimate cases. Case volumes are multiplied by the applicable task minutes and divided by sixty to obtain example variable task hours. Both routes are alternatives and must not be summed.</desc><rect width="1040" height="480" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#153050}.box{fill:#eff6ff;stroke:#83aace;stroke-width:2}.alt{fill:#eafaf6;stroke:#439986;stroke-width:2}.txt{font-size:19px;font-weight:700}.sub{font-size:14px}.arrow{stroke:#7594a9;stroke-width:3;fill:none;marker-end:url(#ar)}</style><defs><marker id="ar" markerWidth="10" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0L9,4.5L0,9" fill="#7594a9"/></marker></defs><text x="55" y="47" font-size="28" font-weight="bold">Why forecast AIV and ACP?</text><text x="55" y="76" font-size="17">Converting financial demand into physical workload</text><rect class="box" x="64" y="110" width="238" height="72" rx="9"/><text class="txt" x="183" y="140" text-anchor="middle">Forecast sales</text><text class="sub" x="183" y="162" text-anchor="middle">for a retail division</text><path class="arrow" d="M302 146H347"/><rect class="box" x="347" y="110" width="230" height="72" rx="9"/><text class="txt" x="462" y="140" text-anchor="middle">× Sector mix</text><text class="sub" x="462" y="162" text-anchor="middle">Allocate relevant sales</text><path class="arrow" d="M577 146H634"/><rect class="box" x="634" y="110" width="323" height="72" rx="9"/><text class="txt" x="795" y="140" text-anchor="middle">Sector sales (£)</text><text class="sub" x="795" y="162" text-anchor="middle">Starting point for volume drivers</text><path class="arrow" d="M795 182V207H262V239"/><path class="arrow" d="M795 207V239"/><rect class="alt" x="87" y="239" width="342" height="81" rx="9"/><text class="txt" x="258" y="266" text-anchor="middle">Item-led: ÷ AIV</text><text class="sub" x="258" y="288" text-anchor="middle">Items → ÷ IPC → estimated cases</text><text class="sub" x="258" y="305" text-anchor="middle">for case-handling tasks</text><rect class="alt" x="644" y="239" width="313" height="81" rx="9"/><text class="txt" x="800" y="267" text-anchor="middle">Case-led: ÷ ACP</text><text class="sub" x="800" y="291" text-anchor="middle">Estimated cases directly</text><path class="arrow" d="M258 320V348H525V370"/><path class="arrow" d="M800 320V348H525V370"/><rect class="box" x="331" y="370" width="388" height="78" rx="9"/><text class="txt" x="525" y="399" text-anchor="middle">× Task SMV ÷ 60</text><text class="sub" x="525" y="423" text-anchor="middle">Illustrative variable task-hours</text><text x="510" y="348" text-anchor="middle" font-size="12">ALTERNATIVE ROUTES — DO NOT ADD</text></svg>